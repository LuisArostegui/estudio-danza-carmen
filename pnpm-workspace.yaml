packages:
  - "."
  - "studio"

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.3.8"
  - astro@7.2.6
  - "@sanity/access-ui@6.11.0"
  - "@sanity/diff@6.11.0"
  - "@sanity/mutator@6.11.0"
  - "@sanity/schema@6.11.0"
  - "@sanity/types@6.11.0"
  - "@sanity/util@6.11.0"
  - "@sanity/vision@6.11.0"
  - sanity@6.11.0

# Narrow overrides until the parent packages adopt the patched versions.
overrides:
  "@vercel/frameworks>js-yaml": "3.15.2"
  "@vercel/frameworks>smol-toml": "1.9.1"
  "linkinator>glob": "14.0.2"
  "@oclif/core>minimatch": "11.0.8"
  "@typescript-eslint/typescript-estree>minimatch": "11.0.8"
  "eslint-plugin-jsx-a11y-x>minimatch": "11.0.8"
