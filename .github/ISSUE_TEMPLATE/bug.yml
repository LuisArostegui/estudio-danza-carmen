name: Bug
description: Report a defect, regression, or incorrect output.
title: "CD-<number> - Bug - "
labels:
  - "type: bug"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be fixed, and what is out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, OS, or relevant tool versions.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, URLs, or related context.
